[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experimentlift"
version = "0.1.0"
description = "Reproducible two-arm marketing experiment analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "pydantic==2.14.4",
    "scipy==1.17.1",
    "statsmodels==0.15.0",
    "SQLAlchemy>=2.0.44,<2.1",
    "alembic>=1.17.2,<1.19",
    "psycopg[binary]>=3.2.12,<3.4",
]

[project.optional-dependencies]
dev = [
    "hypothesis==6.170.17",
    "pytest==8.4.2",
]

[project.scripts]
experimentlift = "experimentlift.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
