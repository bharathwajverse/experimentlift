name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: PostgreSQL 16 integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: experimentlift_test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: experimentlift_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U experimentlift_test -d experimentlift_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://experimentlift_test:disposable_ci_only@127.0.0.1:5432/experimentlift_test
      EXPERIMENTLIFT_TEST_DATABASE_URL: postgresql+psycopg://experimentlift_test:disposable_ci_only@127.0.0.1:5432/experimentlift_test
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Wait for database
        run: |
          python - <<'PY'
          import os
          import time
          import psycopg
          for attempt in range(30):
              try:
                  with psycopg.connect(os.environ["DATABASE_URL"].replace("postgresql+psycopg://", "postgresql://"), connect_timeout=2) as conn:
                      assert conn.execute("select 1").fetchone() == (1,)
                  break
              except psycopg.OperationalError:
                  time.sleep(1)
          else:
              raise RuntimeError("PostgreSQL did not become ready")
          PY
      - name: Verify migration round trip and schema
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m pytest -q tests/test_db_migration.py
      - name: Verify PostgreSQL constraints and transactions
        run: python -m pytest -q tests/test_db_postgres.py
      - name: Regress statistical core
        run: python -m pytest -q --ignore=tests/test_db_postgres.py --ignore=tests/test_db_migration.py
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Create isolated artifact environment
        run: python -m venv .artifact-venv

      - name: Install wheel and test dependencies
        run: >-
          .artifact-venv/bin/python -m pip install
          --disable-pip-version-check
          dist/experimentlift-*.whl
          hypothesis==6.170.17
          pytest==8.4.2

      - name: Verify dependency consistency
        run: .artifact-venv/bin/python -m pip check

      - name: Verify package import
        run: .artifact-venv/bin/python -c "import experimentlift; print(experimentlift.__doc__)"

      - name: Compile source and tests
        run: .artifact-venv/bin/python -m compileall -q src tests

      - name: Run complete test suite against wheel
        run: .artifact-venv/bin/python -m pytest -q

      - name: Verify JSON CLI output
        run: |
          .artifact-venv/bin/experimentlift run --scenario ab_known_effect --format json > report.json
          .artifact-venv/bin/python -c "import json; r=json.load(open('report.json')); assert r['data_source']=='SYNTHETIC'; assert r['status']=='COMPLETE'; assert r['validity']=='VALID'"

      - name: Verify Markdown CLI output
        run: |
          .artifact-venv/bin/experimentlift run --scenario ab_known_effect --format markdown > report.md
          grep -F "SYNTHETIC DATA ONLY" report.md
